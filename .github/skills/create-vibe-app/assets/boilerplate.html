<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Boilerplate</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  font-family: Helvetica, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  margin: 0;
  padding: 16px;
  background-color: #f5f5f5;
  color: #333;
}

input,
textarea {
  font-size: 16px;
  font-family: inherit;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 4px;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #0066cc;
  box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
}

.container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  padding: 24px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

h1 {
  margin-top: 0;
  margin-bottom: 24px;
  font-size: 28px;
}

.form-group {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

label {
  font-weight: 600;
  font-size: 14px;
  color: #555;
}

button {
  font-size: 16px;
  font-family: inherit;
  padding: 10px 20px;
  background-color: #0066cc;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.2s;
}

button:hover {
  background-color: #0052a3;
}

button:active {
  background-color: #003d7a;
}

.message {
  padding: 12px;
  border-radius: 4px;
  margin-top: 16px;
  display: none;
}

.message.success {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
  display: block;
}

.message.error {
  background-color: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
  display: block;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>App Name</h1>
    
    <form id="app-form">
      <div class="form-group">
        <label for="input-field">Label</label>
        <input id="input-field" type="text" placeholder="Enter text...">
      </div>
      
      <button type="submit">Submit</button>
    </form>
    
    <div id="message" class="message"></div>
  </div>

  <script type="module">
// Initialize the app
const form = document.getElementById('app-form');
const messageBox = document.getElementById('message');

form.addEventListener('submit', (event) => {
  event.preventDefault();
  
  const input = document.getElementById('input-field').value.trim();
  
  if (!input) {
    showMessage('Please enter something', 'error');
    return;
  }
  
  // Your logic here
  showMessage('Success!', 'success');
  form.reset();
});

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = `message ${type}`;
  
  // Auto-hide after 3 seconds
  setTimeout(() => {
    messageBox.className = 'message';
  }, 3000);
}
  </script>
</body>
</html>
